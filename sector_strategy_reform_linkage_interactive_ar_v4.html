<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<title>الربط بين الاستراتيجية القطاعية والمتابعة والتقييم وخطة الإصلاح</title>
<style>
:root{color-scheme:light;--navy:#1E2761;--green:#2E7D32;--orange:#C55A11;--purple:#6A1B9A;--red:#C00000;--bg:#F4F6FA;--line:#D5DAE5;--ok:#C8E6C9;--part:#FFF2CC;--wip:#DDEBF7;--block:#F8CBAD;--unc:#E1D5E7;--none:#E3E3E3}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:#1b1f2a;font-size:14px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:16px 24px}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;font-size:12.5px;opacity:.85}
nav{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
nav button{border:0;background:none;padding:12px 18px;font:inherit;font-weight:bold;color:#555;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--navy);border-bottom-color:var(--navy)}
main{padding:18px 24px;max-width:1500px;margin:auto}
.tab{display:none}.tab.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .n{font-size:26px;font-weight:bold;color:var(--navy)}
.card .l{font-size:12.5px;color:#555}
.card.red .n{color:var(--red)}.card.green .n{color:var(--green)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.panel h2{margin:0 0 10px;font-size:16px;color:var(--navy)}
.note{font-size:12px;color:#666;margin-top:6px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top;font-size:13px}
th{background:var(--navy);color:#fff;position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover td{background:#EEF3FF}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;border:1px solid rgba(0,0,0,.12);margin:1px}
.s-ok{background:var(--ok)}.s-part{background:var(--part)}.s-wip{background:var(--wip)}.s-block{background:var(--block)}.s-unc{background:var(--unc)}.s-none{background:var(--none)}.s-red{background:#F4B6B6}.s-extra{background:#CFE2F3}
.bar{height:10px;background:#E8EAF0;border-radius:6px;overflow:hidden;min-width:70px;display:inline-block;width:100%;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--green)}
.bar.m i{background:var(--orange)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#eee}
.stack i{display:block;height:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:150px}
.filters input{min-width:240px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-bottom:10px}
.obj{margin-bottom:18px}
.obj>h3{background:var(--navy);color:#fff;margin:0;padding:8px 12px;border-radius:8px 8px 0 0;font-size:15px}
.resb{background:#fff;border:1px solid var(--line);border-top:0}
.resb>h4{margin:0;padding:8px 12px;background:#E8EEF9;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ind{display:grid;grid-template-columns:70px minmax(220px,1.5fr) repeat(3,minmax(150px,1fr));gap:8px;padding:8px 12px;border-top:1px solid var(--line);align-items:stretch;cursor:pointer}
.ind:hover{background:#F6F9FF}
.ind .id{font-weight:bold;color:var(--navy)}
.node{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;position:relative}
.node b{display:block;font-size:11.5px;color:#444;margin-bottom:2px}
.node.arrow::before{content:"\25C0";position:absolute;right:-12px;top:50%;transform:translateY(-50%);font-size:10px;color:#888}
.node.grey{background:var(--none);color:#555}
.cap{font-size:11.5px;color:#666}
.hdr-row{display:grid;grid-template-columns:70px minmax(220px,1.5fr) repeat(3,minmax(150px,1fr));gap:8px;padding:6px 12px;background:#F0F2F8;font-weight:bold;font-size:12px;color:#444;border:1px solid var(--line);border-top:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.act{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.act:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.act .t{font-weight:bold;margin-bottom:4px}
.ph{background:var(--green);color:#fff;padding:8px 12px;border-radius:8px;margin:14px 0 8px;font-weight:bold}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(720px,96vw);background:#fff;border-right:1px solid var(--line);box-shadow:6px 0 24px rgba(0,0,0,.2);transform:translateX(-105%);transition:transform .2s;z-index:20;overflow:auto;padding:16px 20px}
#drawer.on{transform:none}
#drawer h2{margin:0 0 6px;font-size:17px;color:var(--navy)}
#drawer .x{position:absolute;top:10px;left:14px;border:0;background:#eee;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;margin:8px 0}
.kv div:nth-child(odd){color:#555;font-weight:bold;font-size:12.5px}
.kv div{white-space:pre-wrap}
.sec{margin:14px 0 6px;font-weight:bold;color:#fff;padding:5px 10px;border-radius:6px;font-size:13px}
.sec.n{background:var(--navy)}.sec.g{background:var(--green)}.sec.o{background:var(--orange)}.sec.r{background:var(--red)}
.lk{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:#FAFBFE}
.lk:hover{background:#EEF3FF}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;z-index:15}#shade.on{display:block}
.empty{padding:24px;text-align:center;color:#777}
.pcell{min-width:110px}
.pcell small{font-size:11.5px;color:#555}
.panel{overflow-x:auto}#mapBody,#actBody,#gapBody{overflow-x:auto}
@media(max-width:1000px){.ind{grid-template-columns:1fr !important}.hdr-row{display:none !important}.node.arrow::before{display:none}main{padding:12px}.pgrid{grid-template-columns:1fr}#drawer{width:100vw}.kv{grid-template-columns:100px 1fr}table{min-width:640px}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px}
.cbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cbox h2{margin:0 0 4px;font-size:15px;color:var(--navy)}
.cbox .cv{position:relative;height:340px}
.cbox.tall .cv{height:900px}
.qrow{display:grid;grid-template-columns:60px minmax(220px,2fr) minmax(170px,1fr) minmax(170px,1fr) 90px;gap:10px;padding:8px 12px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.qrow:hover{background:#F6F9FF}
.qres{background:#E8EEF9;font-weight:bold}
.qind{background:#fff;padding-right:28px;font-weight:normal}
.qhead{display:grid;grid-template-columns:60px minmax(220px,2fr) minmax(170px,1fr) minmax(170px,1fr) 90px;gap:10px;padding:6px 12px;background:#F0F2F8;font-weight:bold;font-size:12px;color:#444;border:1px solid var(--line)}
.pv{font-weight:bold;font-size:13px}
@media(max-width:1000px){.qrow,.qhead{grid-template-columns:1fr !important}.qhead{display:none}.cgrid{grid-template-columns:1fr}}
</style>
</head>

function stack(counts,cols){const t=counts.reduce((s,x)=>s+x,0)||1;return '<div class="stack">'+counts.map((c,k)=>c?'<i title="'+c+'" style="width:'+(c/t*100)+'%;background:'+cols[k]+'"></i>':'').join("")+'</div>'}
const SL=s=>s==="-"?"لا ينطبق (صفر مقابل صفر)":String(s).replace("تقرير المتابعة والتقييم",T2);
const TX=s=>s==null?s:String(s).replace(/تقرير المتابعة والتقييم/g,T2).replace(/المتابعة والتقييم/g,T2).replace(/تقرير الإنجاز/g,"تقرير إنجاز المبادرة");
const SCOL={ok:"#81C784",part:"#FFD54F",wip:"#90CAF9",block:"#EF9A9A",unc:"#CE93D8",none:"#BDBDBD"};
const SKEYS=["ok","part","wip","block","unc","none"];
function statusCounts(list){return SKEYS.map(k=>list.filter(a=>a.st===ST_ACT[k]).length)}
function legendA(){return '<div class="legend">'+SKEYS.map(k=>'<span class="chip '+ACLS[ST_ACT[k]]+'">'+ST_ACT[k]+'</span>').join("")+'</div>'}

// ---------- overview ----------
function renderOver(){
  const core=D.inds.filter(i=>!i.extra);
  const noAct=core.filter(i=>!i.hasAct).length, noME=core.filter(i=>!i.hasME).length, full=core.filter(i=>i.flags.includes("full")).length;
  const A63=D.acts.filter(a=>a.prog!=="بلا رقم");
  const sc=statusCounts(A63);
  const ap=avg(A63.map(a=>a.pct));
  const metOK=core.filter(i=>i.st==="تحقق الهدف أو تجاوزه").length;
  let h='<div class="panel"><h2>كيف تقرأ هذه الصفحة</h2><div class="kv" style="grid-template-columns:170px 1fr"><div>سلسلة الربط</div><div>لكل مؤشر في الاستراتيجية القطاعية أربع حلقات: 1 الاستراتيجية القطاعية (الأساس: خط الأساس والاستهدافات)، ثم 2 '+T2+' (القيمة المحققة 2025)، ثم 3 '+T3+' (الأنشطة المرتبطة بالمؤشر في خطة الوزارة)، ثم 4 '+T4+' (حالة كل نشاط). اللون الرمادي يعني انقطاع الحلقة.</div><div>عدد المؤشرات</div><div>54 مؤشراً في الاستراتيجية، يضاف إليها بندان من '+T2+' لا يردان في الاستراتيجية (3.5.أ و3.5.ب)، ويظهران في خريطة الربط والرسوم فقط ولا يدخلان في الأرقام الإجمالية.</div><div>نسبة الإنجاز</div><div>للمؤشر: المحقق إلى هدف 2025 من '+T2+'. للنشاط: من '+T4+'، قياس مباشر حيث يذكر التقرير رقماً مقابل الاستهداف، وإلا تقدير بحسب الحالة.</div><div>نوع الربط</div><div>مباشر أو غير مباشر، وهو تقدير تحليلي لم يرد في أي وثيقة، وسبب كل ربط ظاهر في تفاصيل المؤشر.</div></div></div><div class="cards">'+
   card(core.length,"مؤشراً في الاستراتيجية")+
   card(core.length-noME,"مؤشراً له قيمة في تقرير المتابعة و التقييم- نموذج التخطيط 2025","green")+
   card(core.length-noAct,"مؤشراً مرتبطاً بـمبادرة الاصلاح","green")+
   card(noAct,"مؤشراً بلا نشاط في مبادرة الاصلاح","red")+
   card(full,"مؤشراً بسلسلة ربط كاملة (الحلقات الأربع)","green")+
   card(metOK,"مؤشراً حقق هدف 2025 في "+T2)+
   card(A63.length,"نشاطاً في "+T3+" (خطة الوزارة)")+
   card(sc[0]+sc[1]+sc[2],"نشاطاً محققاً أو جزئياً أو قيد التنفيذ (وفق "+T4+")")+
   card(sc[3],"نشاطاً متعثراً أو معلقاً","red")+
   card(sc[5],"نشاطاً غير وارد في تقرير إنجاز المبادرة","red")+
   card(Math.round(ap)+"%","متوسط نسبة إنجاز الأنشطة (تقدير)")+'</div>';
  h+='<div class="panel"><h2>سلسلة الربط حسب النتيجة الاستراتيجية</h2><div class="note" style="margin:0 0 8px">كل صف يبين كم مؤشراً في النتيجة يملك كل حلقة من السلسلة: الاستراتيجية، ثم تقرير المتابعة و التقييم- نموذج التخطيط 2025، ثم مبادرة الاصلاح، ثم تقرير إنجاز المبادرة حتى حزيران ٢٠٢٦. انقر على الصف لعرض مؤشراته في خريطة الربط.</div><table><tr><th>النتيجة</th><th>المؤشرات</th><th>في تقرير المتابعة و التقييم- نموذج التخطيط 2025</th><th>مرتبطة بـمبادرة الاصلاح</th><th>لها إنجاز في تقرير إنجاز المبادرة حتى حزيران ٢٠٢٦</th><th>بلا نشاط</th><th>متوسط نسبة المحقق (تقرير المتابعة و التقييم- نموذج التخطيط 2025)</th><th>متوسط إنجاز الأنشطة المرتبطة</th></tr>';
  D.res.forEach(r=>{
    const L=r.inds, n=L.length;
    const me=L.filter(i=>i.hasME).length, ac=L.filter(i=>i.hasAct).length, rp=L.filter(i=>i.hasRep).length;
    const ip=avg(L.map(i=>i.pcap));
    const seen=new Set(r.acts.map(a=>a.id));
    const apx=r.pA;
    h+='<tr class="click" data-res="'+r.no+'"><td><b>'+esc(r.no)+'</b> '+esc(r.txt.replace(/^النتيجة [0-9.]+:\s*/,""))+'</td><td>'+n+'</td><td>'+cellc(me,n)+'</td><td>'+cellc(ac,n)+'</td><td>'+cellc(rp,n)+'</td><td>'+(n-ac?'<span class="chip s-red">'+(n-ac)+'</span>':'0')+'</td><td class="pcell">'+bar(ip==null?null:ip*100)+'<small>'+(ip==null?"":Math.round(ip*100)+"%")+'</small></td><td class="pcell">'+bar(apx,"m")+'<small>'+(apx==null?"":Math.round(apx)+"% من "+seen.size+" نشاطاً")+'</small></td></tr>';
  });
  h+='</table><div class="note">نسبة المحقق في تقرير المتابعة و التقييم- نموذج التخطيط 2025 محدودة بـ100% في المتوسط، وتُحتسب للمؤشرات التي لها نسبة رقمية فقط. إنجاز الأنشطة تقدير: قياس مباشر حيث يذكر التقرير رقماً قابلاً للمقارنة، وإلا فبحسب الحالة (محقق 100، جزئي 50، قيد التنفيذ 25، متعثر 10).</div></div>';
  h+='<div class="panel"><h2>حالة تنفيذ الأنشطة ونسبة الإنجاز حسب البرنامج</h2>'+legendA()+'<table><tr><th>البرنامج</th><th>الأنشطة</th><th>التوزيع حسب الحالة</th><th>متوسط نسبة الإنجاز</th><th>مقاسة مباشرة</th></tr>';
  D.progs.forEach(p=>{
    const L=D.acts.filter(a=>a.prog===p.n);const c=statusCounts(L);const ap=avg(L.map(a=>a.pct));
    h+='<tr class="click" data-prog="'+p.n+'"><td><b>'+p.n+'</b> '+esc(p.name)+'</td><td>'+L.length+'</td><td style="min-width:240px">'+stack(c,SKEYS.map(k=>SCOL[k]))+'<div class="cap">'+SKEYS.map((k,x)=>c[x]?c[x]+" "+SHORT[ST_ACT[k]]:"").filter(Boolean).join(" ، ")+'</div></td><td class="pcell">'+bar(ap,"m")+'<small>'+(ap==null?"":Math.round(ap)+"%")+'</small></td><td>'+L.filter(a=>a.pk==="m").length+' من '+L.length+'</td></tr>';
  });
  h+='</table></div>';
  h+='<div class="panel"><h2>حالة المؤشرات في تقرير المتابعة و التقييم- نموذج التخطيط 2025</h2><div class="legend">'+Object.keys(ICLS).map(k=>chipI(k)).join("")+'</div><table><tr><th>الهدف الاستراتيجي</th><th>المؤشرات</th><th>التوزيع</th></tr>';
  Object.keys(D.obj).forEach(o=>{const L=D.inds.filter(i=>i.obj===D.obj[o]&&!i.extra);const keys=Object.keys(ICLS);const c=keys.map(k=>L.filter(i=>i.st===k).length);
    const cols=["#81C784","#FFD54F","#E57373","#EF9A9A","#CE93D8","#BDBDBD","#90CAF9","#BDBDBD"];
    h+='<tr><td><b>'+o+'</b> '+esc(D.obj[o])+'</td><td>'+L.length+'</td><td style="min-width:260px">'+stack(c,cols)+'<div class="cap">'+keys.map((k,x)=>c[x]?c[x]+" "+SL(k):"").filter(Boolean).join(" ، ")+'</div></td></tr>'});
  h+='</table></div>';
  $("over").innerHTML=h;
  $("over").querySelectorAll("tr[data-res]").forEach(t=>t.onclick=()=>{go("map");$("fRes").value=t.dataset.res;renderMap()});
  $("over").querySelectorAll("tr[data-prog]").forEach(t=>t.onclick=()=>{go("acts");$("aProg").value=t.dataset.prog;renderActs()});
}
function card(n,l,c){return '<div class="card '+(c||"")+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'}
function cellc(x,n){return '<div class="bar"><i style="width:'+(n?x/n*100:0)+'%"></i></div><small>'+x+' من '+n+'</small>'}

// ---------- map ----------
function initMap(){
  $("map").innerHTML='<div class="filters"><select id="fObj"><option value="">كل الأهداف</option>'+Object.keys(D.obj).map(o=>'<option value="'+o+'">الهدف '+o+'</option>').join("")+'</select><select id="fRes"><option value="">كل النتائج</option>'+D.res.map(r=>'<option value="'+r.no+'">النتيجة '+r.no+'</option>').join("")+'</select><select id="fChain"><option value="">كل الحالات</option><option value="noAct">بلا نشاط في مبادرة الاصلاح</option><option value="noME">بلا مؤشر في تقرير المتابعة و التقييم- نموذج التخطيط 2025</option><option value="noRep">نشاط بلا إنجاز في تقرير إنجاز المبادرة حتى حزيران ٢٠٢٦</option><option value="full">سلسلة كاملة</option></select><select id="fSt"><option value="">كل حالات المؤشر</option>'+Object.keys(ICLS).map(k=>'<option value="'+esc(k)+'">'+esc(SL(k))+'</option>').join("")+'</select><input id="fQ" placeholder="بحث في المؤشر أو النشاط"></div><div class="legend"><span class="chip s-ok">محقق</span><span class="chip s-part">جزئي</span><span class="chip s-wip">قيد التنفيذ</span><span class="chip s-block">متعثر أو غير مبلغ</span><span class="chip s-unc">يحتاج توضيح</span><span class="chip s-red">لم يتحقق</span><span class="chip s-none">لا يوجد (انقطاع في السلسلة)</span></div><div id="mapBody"></div>';
  ["fObj","fRes","fChain","fSt"].forEach(k=>$(k).onchange=renderMap);$("fQ").oninput=renderMap;
}
function actSummary(list,i){
  if(!list.length)return '<div class="node grey"><b>'+T4+'</b>'+(i&&i.hasAct?'لا يوجد إنجاز مبلغ للبنود المرتبطة بالمؤشر':'لا ينطبق، لا يوجد نشاط')+'</div>';
  const c={};list.forEach(a=>c[a.st]=(c[a.st]||0)+1);
  const best=list.some(a=>a.st===ST_ACT.ok)?"s-ok":list.some(a=>a.st===ST_ACT.part||a.st===ST_ACT.wip)?"s-part":list.some(a=>a.st===ST_ACT.block)?"s-block":list.some(a=>a.st===ST_ACT.unc)?"s-unc":"grey";
  const ap=avg(list.map(a=>a.pct));
  return '<div class="node '+(best==="grey"?"grey":best)+'"><b>تقرير إنجاز المبادرة حتى حزيران ٢٠٢٦</b>'+Object.keys(c).map(k=>c[k]+" "+esc(SHORT[k])).join(" ، ")+(ap==null?"":'<div class="cap">متوسط الإنجاز '+Math.round(ap)+'%</div>')+'</div>'}
function renderMap(){
  const fo=$("fObj").value,fr=$("fRes").value,fc=$("fChain").value,fs=$("fSt").value,q=$("fQ").value.trim();
  let L=D.inds.filter(i=>(!fo||i.obj===D.obj[fo])&&(!fr||i.res===fr)&&(!fc||i.flags.includes(fc))&&(!fs||i.st===fs));
  if(q)L=L.filter(i=>(i.ind+" "+i.id+" "+i.ua.map(a=>a.act+" "+(a.repAct||"")).join(" ")).indexOf(q)>-1);
  let h='<div class="hdr-row"><div>المؤشر</div><div>1 الاستراتيجية القطاعية</div><div>2 تقرير المتابعة و التقييم- نموذج التخطيط 2025</div><div>3 مبادرة الاصلاح</div><div>4 تقرير إنجاز المبادرة حتى حزيران ٢٠٢٦</div></div>';
  if(!L.length)h+='<div class="empty">لا توجد نتائج مطابقة</div>';
  const byRes={};L.forEach(i=>{(byRes[i.res]=byRes[i.res]||[]).push(i)});
  const objsDone=new Set();
  D.res.forEach(r=>{ if(!byRes[r.no])return;
    const o=r.no.split(".")[0];
    if(!objsDone.has(o)){objsDone.add(o);h+='<div class="obj"><h3>الهدف الاستراتيجي '+o+': '+esc(D.obj[o])+'</h3></div>'}
    h+='<div class="resb"><h4><span>'+esc(r.txt)+'</span><span class="cap">'+byRes[r.no].length+' من '+CNT(r.inds.length+r.extras.length)+'</span></h4>';
    byRes[r.no].forEach(i=>{
      const meCls=ICLS[i.st]||"s-none";
      const meNode=!i.hasME?'<div class="node grey arrow"><b>تقرير المتابعة و التقييم- نموذج التخطيط 2025</b>لا يوجد مؤشر مقابل</div>':'<div class="node '+meCls+' arrow"><b>تقرير المتابعة و التقييم- نموذج التخطيط 2025</b>'+esc(SL(i.st))+'<div class="cap">'+(i.mergedME?"قيمة مدمجة مشتركة بين عدة صفوف في ملف التقرير، انظر التفاصيل":(i.meA!=null?"المحقق "+esc(fmt(i.meA))+" مقابل هدف "+esc(fmt(i.meT)):""))+(i.pct!=null?" ("+pctf(i.pct)+")":"")+'</div></div>';
      const stNode='<div class="node s-ok" style="background:#E8EEF9"><b>الاستراتيجية</b>'+(i.extra?'لا يوجد في الاستراتيجية (بند إضافي من التقرير)':'خط الأساس '+val(i.b)+' ، 2025: '+val(i.t25))+'</div>';
      const actNode=i.hasAct?'<div class="node s-wip arrow" style="background:#E3F1E4"><b>مبادرة الاصلاح</b>'+(i.ua.filter(a=>a.prog!=="بلا رقم").length?i.ua.filter(a=>a.prog!=="بلا رقم").length+' نشاط':'')+(i.ua.some(a=>a.prog==="بلا رقم")?(i.ua.filter(a=>a.prog!=="بلا رقم").length?' و':'')+i.ua.filter(a=>a.prog==="بلا رقم").length+' بند سردي':'')+' ('+(i.acts.some(l=>l.ty==="مباشر")?"فيها ربط مباشر":"ربط غير مباشر")+')<div class="cap">'+i.ua.slice(0,3).map(a=>esc(a.id)+(a.name?": "+esc(a.name.slice(0,40))+"...":"")).join("<br>")+(i.ua.length>3?"<br>و"+(i.ua.length-3)+" أخرى":"")+'</div></div>':'<div class="node grey arrow"><b>مبادرة الاصلاح</b>لا يوجد نشاط مقابل</div>';
      h+='<div class="ind" data-i="'+i.id+'"><div class="id">'+esc(i.id)+'</div><div>'+esc(i.ind)+(i.grp?' <span class="cap">(البند الفرعي: '+esc(i.grp)+')</span>':'')+'</div>'+stNode+meNode+actNode+'</div>';
    });
    h+='</div>';
  });
  // restructure to 5 columns: the 4th chain node placed with rep summary
  $("mapBody").innerHTML=h;
  $("mapBody").querySelectorAll(".ind").forEach(e=>{const i=indById[e.dataset.i];e.insertAdjacentHTML("beforeend",actSummary(i.rep,i));e.style.gridTemplateColumns="70px minmax(200px,1.3fr) repeat(4,minmax(140px,1fr))";e.onclick=()=>openInd(i.id)});
  $("mapBody").querySelectorAll(".hdr-row").forEach(e=>{e.style.gridTemplateColumns="70px minmax(200px,1.3fr) repeat(4,minmax(140px,1fr))"});
}

// ---------- activities ----------
function initActs(){
  $("acts").innerHTML='<div class="filters"><select id="aProg"><option value="">كل البرامج</option>'+D.progs.map(p=>'<option value="'+p.n+'">البرنامج '+p.n+'</option>').join("")+'<option value="بلا رقم">بنود سردية</option></select><select id="aSt"><option value="">كل الحالات</option>'+SKEYS.map(k=>'<option>'+ST_ACT[k]+'</option>').join("")+'</select><select id="aLink"><option value="">كل الأنشطة</option><option value="nolink">بلا مؤشر مرتبط</option><option value="resonly">مرتبط على مستوى النتيجة فقط</option><option value="ind">مرتبط بمؤشر</option></select><input id="aQ" placeholder="بحث في نص النشاط أو الإنجاز"></div>'+legendA()+'<div id="actBody"></div>';
  ["aProg","aSt","aLink"].forEach(k=>$(k).onchange=renderActs);$("aQ").oninput=renderActs;
}
function renderActs(){
  const fp=$("aProg").value,fs=$("aSt").value,fl=$("aLink").value,q=$("aQ").value.trim();
  let L=D.acts.filter(a=>(!fp||String(a.prog)===fp)&&(!fs||a.st===fs));
  if(fl==="nolink")L=L.filter(a=>!a.indL.length);
  if(fl==="resonly")L=L.filter(a=>a.indL.length&&a.indL.every(l=>l.ind==="على مستوى النتيجة"));
  if(fl==="ind")L=L.filter(a=>a.indL.some(l=>l.ind!=="على مستوى النتيجة"));
  if(q)L=L.filter(a=>(a.act+" "+(a.repAct||"")+" "+(a.repAch||"")).indexOf(q)>-1);
  const groups={};L.forEach(a=>{(groups[a.prog]=groups[a.prog]||[]).push(a)});
  let h="";
  Object.keys(groups).forEach(k=>{
    const p=D.progs.find(x=>String(x.n)===k);const g=groups[k];
    h+='<div class="ph">'+(p?'البرنامج '+p.n+': '+esc(p.name):'بنود سردية خارج جداول البرامج')+' <span style="font-weight:normal">('+g.length+' نشاط، متوسط الإنجاز '+(avg(g.map(a=>a.pct))==null?"غير متاح":Math.round(avg(g.map(a=>a.pct)))+"%")+')</span></div><div class="pgrid">';
    g.forEach(a=>{
      const inds=[...new Set(a.indL.filter(l=>l.ind!=="على مستوى النتيجة").map(l=>l.ind))];
      h+='<div class="act" data-a="'+a.id+'"><div class="t">'+esc(a.id)+(a.name?': '+esc(a.name.slice(0,130)):'')+'</div>'+(a.repLab&&a.repLab.length?'<div class="cap">في تقرير إنجاز المبادرة: بند '+esc(a.repLab.join(" و "))+'</div>':'')+chipA(a.st)+'<div style="margin:6px 0">'+bar(a.pct,"m")+'<small>'+(a.pct==null?"":a.pct+"% ("+(a.pk==="m"?"قياس مباشر":"تقدير")+")")+'</small></div><div class="cap">المؤشرات: '+(inds.length?esc(inds.join(" ، ")):(a.indL.length?"على مستوى النتيجة فقط":"لا يوجد ربط"))+'</div></div>';
    });
    h+='</div>';
  });
  if(!L.length)h='<div class="empty">لا توجد نتائج مطابقة</div>';
  $("actBody").innerHTML=h;
  $("actBody").querySelectorAll(".act").forEach(e=>e.onclick=()=>openAct(e.dataset.a));
}

// ---------- gaps ----------
function initGaps(){
  const cats=[...new Set(D.gaps.map(g=>g.cat))];
  $("gaps").innerHTML='<div class="filters"><select id="gCat"><option value="">كل الفئات</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join("")+'</select><select id="gPr"><option value="">كل الأولويات</option><option>عالية</option><option>متوسطة</option><option>منخفضة</option></select><input id="gQ" placeholder="بحث"></div><div class="note" style="margin-bottom:8px">الأولويات والإجراءات المقترحة تقدير تحليلي ويحتاج مراجعة فريق الوزارة.</div><div id="gapBody"></div>';
  ["gCat","gPr"].forEach(k=>$(k).onchange=renderGaps);$("gQ").oninput=renderGaps;
}
function renderGaps(){
  const c=$("gCat").value,p=$("gPr").value,q=$("gQ").value.trim();
  const L=D.gaps.filter(g=>(!c||g.cat===c)&&(!p||g.pr===p)&&(!q||(g.ref+g.desc+g.ev+g.act).indexOf(q)>-1));
  const pc={"عالية":"s-block","متوسطة":"s-part","منخفضة":"s-ok"};

let QOPEN=false;const QO={};
function pbar(p,cls,txt){return p==null?'<span class="cap">'+(txt||"لا ينطبق")+'</span>':'<div class="pv">'+(txt||Math.round(p)+"%")+'</div>'+bar(p,cls)}
function renderQuick(){
  const fo=$("qObj").value,so=$("qSort").value,q=$("qQ").value.trim();
  let R=D.res.filter(r=>!fo||r.no.split(".")[0]===fo);
  const key=r=>{const a=r.pI,b=r.pA;const v=[a==null?null:a*100,b].filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:-1};
  if(so==="low")R=[...R].sort((a,b)=>key(a)-key(b));if(so==="high")R=[...R].sort((a,b)=>key(b)-key(a));
  let h="";
  R.forEach(r=>{
    let L=(QOPEN||QO[r.no]||q)?r.inds.concat(r.extras):r.inds;if(q)L=L.filter(i=>(i.id+" "+i.ind).indexOf(q)>-1||(r.txt).indexOf(q)>-1);
    if(q&&!L.length)return;
    const open=QOPEN||QO[r.no]||!!q;
    h+='<div class="qrow qres" data-r="'+r.no+'"><div>'+esc(r.no)+'</div><div>'+esc(r.txt.replace(/^النتيجة [0-9.]+:\s*/,""))+' <span class="cap">('+CNT(r.inds.length)+(r.extras.length?' وبند إضافي من التقرير':'')+')</span></div><div>'+pbar(r.pI==null?null:r.pI*100,"")+'</div><div>'+pbar(r.pA,"m")+'</div><div>'+r.acts.length+'</div></div>';
    if(open)L.forEach(i=>{const ia=indAct(i);
      h+='<div class="qrow qind" data-i="'+i.id+'"><div>'+esc(i.id)+'</div><div>'+esc(i.ind)+(i.grp?' <span class="cap">(البند الفرعي: '+esc(i.grp)+')</span>':'')+'<div>'+chipI(i.st)+'</div></div><div>'+(i.pct!=null?pbar(Math.min(i.pct,1)*100,"",pctf(i.pct)):'<span class="cap">لا ينطبق ('+esc(SL(i.st))+')</span>')+'</div><div>'+(ia.n?pbar(ia.v,"m",ia.v==null?"غير متاح":null)+'<span class="cap">'+(ia.dir?"ربط مباشر":"ربط غير مباشر")+'</span>':'<span class="chip s-red">لا يوجد نشاط</span>')+'</div><div>'+ia.n+'</div></div>';
    });
  });
  $("qBody").innerHTML=h||'<div class="empty">لا توجد نتائج</div>';
  const objs=Object.keys(D.obj).map(o=>{const rs=D.res.filter(r=>r.no.split(".")[0]===o);return '<div class="card"><div class="l"><b>الهدف '+o+'</b>: '+esc(D.obj[o])+'</div><div class="l" style="margin-top:6px">متوسط نسبة المحقق: <b>'+Math.round(avg(rs.map(r=>r.pI))*100)+'%</b></div><div class="l">متوسط إنجاز '+T3+': <b>'+Math.round(avg(rs.map(r=>r.pA)))+'%</b></div></div>'});
  $("qObjs").innerHTML='<div class="cards">'+objs.join("")+'</div>';
  $("qBody").querySelectorAll(".qres").forEach(e=>e.onclick=()=>{QO[e.dataset.r]=!QO[e.dataset.r];renderQuick()});
  $("qBody").querySelectorAll(".qind").forEach(e=>e.onclick=()=>openInd(e.dataset.i));
}

  new Chart($("c9"),{type:"bar",data:{labels:pi.map(i=>i.id+(i.extra?" (إضافي)":"")),datasets:[{label:"نسبة المحقق %",backgroundColor:pi.map(i=>i.pct>=1?"#66BB6A":i.pct>=0.5?"#FFCA28":"#EF5350"),data:pi.map(i=>Math.round(Math.min(i.pct,1)*100))}]},options:(()=>{const o=rtlBar(true);o.scales.x.max=100;o.plugins.legend={display:false};return o})()});
}
// ---------- boot ----------
function go(t){if(t==='charts')setTimeout(renderCharts,30);if(t==='quick')renderQuick();document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.id===t));document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));window.scrollTo(0,0)}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
initQuick();initMap();initActs();initGaps();renderAbout();renderOver();renderMap();renderActs();renderGaps();
</script>
</body>
